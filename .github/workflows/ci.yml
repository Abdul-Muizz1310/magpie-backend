name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/
  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Install Playwright chromium
        run: uv run playwright install chromium --with-deps
      # No -m filter on purpose: runners have a Docker daemon, so this also runs
      # the `slow` Testcontainers-Postgres tier (docs/specs/08-test-tiers.md).
      # The `smoke` tier self-skips here because SMOKE_BASE_URL is deliberately
      # NOT passed to this job — the live probe belongs to the `smoke` job below,
      # and setting it here would change this job's passed/skipped counts.
      - run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --build-arg COMMIT_SHA is required: the Dockerfile defaults the ARG to
      # "unknown" and promotes it to ENV, so an image built without it reports a
      # placeholder from /version forever.
      - run: |
          docker build \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            -t magpie-backend:${{ github.sha }} .
      - name: Assert the built image reports the real commit SHA
        run: |
          got=$(docker run --rm --entrypoint sh magpie-backend:${{ github.sha }} -c 'printf %s "$COMMIT_SHA"')
          test "$got" = "${{ github.sha }}" || { echo "COMMIT_SHA baked as '$got'"; exit 1; }

  # NOTE: no deploy job — the Render service auto-deploys main on push. This job
  # verifies the deploy that push triggered actually came up, by running the
  # `smoke` tier (docs/specs/08-test-tiers.md) against the live origin.
  #
  # It is inert unless the SMOKE_BASE_URL repository *variable* is set: the tier
  # calls require_smoke_target() first, which skips before any HTTP request is
  # made, so a fork PR or a parked free-tier service can never fail CI. A
  # variable and not a secret — the value is a public URL, and secrets are not
  # exposed to fork pull requests.
  #
  # SMOKE_BASE_URL is a bare origin with no trailing slash and no path (e.g.
  # https://magpie-backend-t4bb.onrender.com); the tests append /health and
  # /version themselves.
  smoke:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      # --no-cov: this job runs 2 of ~475 tests, so pyproject's addopts coverage
      # gate (--cov-fail-under=80) would fail on principle. The gate is the
      # `test` job's responsibility.
      - name: Post-deploy smoke tier (skipped when SMOKE_BASE_URL is unset)
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: uv run pytest -m smoke --no-cov
