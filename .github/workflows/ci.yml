name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/
  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Install Playwright chromium
        run: uv run playwright install chromium --with-deps
      # No -m filter on purpose: runners have a Docker daemon, so this also runs
      # the `slow` Testcontainers-Postgres tier (docs/specs/08-test-tiers.md).
      # The `smoke` tier self-skips because MAGPIE_SMOKE_URL is unset here.
      - run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --build-arg COMMIT_SHA is required: the Dockerfile defaults the ARG to
      # "unknown" and promotes it to ENV, so an image built without it reports a
      # placeholder from /version forever.
      - run: |
          docker build \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            -t magpie-backend:${{ github.sha }} .
      - name: Assert the built image reports the real commit SHA
        run: |
          got=$(docker run --rm --entrypoint sh magpie-backend:${{ github.sha }} -c 'printf %s "$COMMIT_SHA"')
          test "$got" = "${{ github.sha }}" || { echo "COMMIT_SHA baked as '$got'"; exit 1; }
