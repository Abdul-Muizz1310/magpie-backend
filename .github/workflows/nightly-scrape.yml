name: nightly-scrape
on:
  schedule:
    # Runs hourly; the ``discover`` job filters to the sources whose own
    # per-source ``schedule`` cron actually fires in this hour (so a 6-hourly
    # source runs 4x/day and a weekly one runs Sunday 00:00, all honoured).
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source name (blank = all)"
        required: false

jobs:
  # Discover the matrix from configs/*.yaml so adding a new config doesn't
  # require editing this workflow. ``magpie due`` filters to the sources due
  # this hour per their declared cron (manual dispatch runs all via --all).
  # Emits two JSON arrays: ``sources`` and ``js_sources`` (render:true only,
  # so Playwright chromium is installed just for those legs).
  discover:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.find.outputs.sources }}
      js_sources: ${{ steps.find.outputs.js_sources }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv
      - run: uv sync --frozen
      - id: find
        env:
          # Hourly cadence -> 1h look-back window so each cron fires once.
          WINDOW_SECONDS: "3600"
        run: >-
          uv run python -m magpie.cli due
          --window-seconds "$WINDOW_SECONDS"
          ${{ github.event_name == 'workflow_dispatch' && '--all' || '' }}

  run:
    needs: discover
    # ``discover`` returning "[]" is the correct answer for the ~19 hours a day
    # when no source's declared cron fires. GitHub treats a matrix vector that
    # expands to [] as a hard error ("Matrix vector 'source' does not contain any
    # values"), which would mark the whole hourly run red — and wake
    # heal-on-failure (it triggers on conclusion == 'failure') to run the LLM
    # healer against sources that never broke. Skip the job instead: a skipped
    # job leaves the run green. The empty-string arm covers a discover step that
    # never set the output at all.
    if: >-
      needs.discover.outputs.sources != ''
      && needs.discover.outputs.sources != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.discover.outputs.sources) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv
      - run: uv sync --frozen
      - name: Install Playwright chromium
        if: contains(fromJson(needs.discover.outputs.js_sources), matrix.source)
        run: uv run playwright install chromium --with-deps
      - name: Apply migrations (idempotent)
        run: uv run python -m magpie.cli migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: uv run python -m magpie.cli run ${{ matrix.source }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # No R2_* here on purpose: neither scrape engine archives pre-parse HTML
          # to R2, so nothing in this job could read them. See the "Not shipped
          # (planned)" section of docs/specs/01-factory.md.
