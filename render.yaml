services:
  - type: web
    name: magpie-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      # R2 is PLANNED, not wired: no code path reads or writes these yet. The
      # healer re-fetches live HTML instead of reading an archived snapshot, and
      # `html_snapshot_url` is always null in API responses. Kept provisioned so
      # enabling the archive later needs no blueprint change.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      # Explicit free-tier slug so an unset dashboard value never silently
      # falls back to a paid model (MAG-5). Override in the dashboard if needed.
      - key: OPENROUTER_MODEL_PRIMARY
        value: nvidia/nemotron-nano-9b-v2:free
      - key: GITHUB_PAT_SCRAPE_HEALER
        sync: false
      - key: GITHUB_REPO
        value: Abdul-Muizz1310/magpie-backend
      - key: GITHUB_HEAL_LABEL
        value: "scrape:self-heal"
      - key: APP_ENV
        value: production
      # NOTE (/version commit SHA): Render Blueprints expose no Docker build-arg
      # field, so the Dockerfile's `ARG COMMIT_SHA=unknown` keeps its default on
      # Render and the real value has to arrive at runtime. Render injects the
      # deployed commit as the predefined RENDER_GIT_COMMIT variable, and
      # `magpie.platform.health.commit_sha()` resolves
      # COMMIT_SHA -> RENDER_GIT_COMMIT -> GITHUB_SHA while skipping the
      # "unknown" placeholder — so /version reports the deployed SHA here with no
      # extra envVars entry. Builders that *can* pass --build-arg (CI, local
      # `docker build`) bake COMMIT_SHA directly and take precedence.
      # Auth posture for the live deployment. DEMO_MODE=false means the
      # X-Platform-Token middleware enforces bastion-minted tokens whenever a
      # public key is configured (BASTION_SIGNING_KEY_PUBLIC or
      # BASTION_PUBLIC_KEY_URL). Leaving it unset now also fails closed in code,
      # but we set it explicitly so the intent is visible (02 unauth finding).
      - key: DEMO_MODE
        value: "false"
      - key: BASTION_SIGNING_KEY_PUBLIC
        sync: false
      # Per-IP rate limit for mutating/scrape/enqueue routes (requests/minute).
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: FRONTEND_URL
        value: https://magpie-frontend-three.vercel.app

# NOTE (MAG-2): the Procrastinate worker runs embedded in this single free-tier
# web service (see src/magpie/lifespan.py). Render free web services sleep after
# ~15 min idle, so the */15 stale-run reaper and any queued heals only progress
# while the service is awake (an inbound request wakes it and boots the worker
# before the handler enqueues). The synchronous CLI path (`magpie run`, used by
# the GitHub Actions scheduler) is the always-available flow and does not depend
# on the worker. Promote the worker to a dedicated `type: worker` service on a
# paid always-on plan if guaranteed background drain is required.
